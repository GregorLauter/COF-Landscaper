name: Publish release
on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

jobs:
    publish-release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
            - uses: actions/setup-python@v5
              with:
                  python-version-file: "pyproject.toml"

            - name: Build source distribution and wheel
              run: |
                  dist=$(mktemp -d "$RUNNER_TEMP/cof-dist.XXXXXXXX")
                  uv build --out-dir "$dist"
                  echo "RELEASE_DIST=$dist" >> "$GITHUB_ENV"

            - name: Validate release artifacts
              run: |
                  python -m pip install twine packaging
                  python -m twine check --strict "$RELEASE_DIST"/*
                  python .github/scripts/check_release.py "$GITHUB_REF_NAME" "$RELEASE_DIST"/*.whl "$RELEASE_DIST"/*.tar.gz

            - name: Smoke-test the installed wheel
              working-directory: ${{ runner.temp }}
              run: |
                  python -m venv smoke
                  uv pip install --python smoke/bin/python --torch-backend=cpu "$RELEASE_DIST"/*.whl
                  smoke/bin/python -I -c "import coflandscaper"

            - name: Publish validated artifacts
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
              run: uv publish "$RELEASE_DIST"/*.whl "$RELEASE_DIST"/*.tar.gz
